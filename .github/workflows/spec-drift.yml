name: spec-drift

# Atlassian edits the Bitbucket OpenAPI spec without notice. Checking it on a weekly
# cron rather than in PR CI means an upstream edit never reddens an unrelated PR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: drift
        run: pnpm run generate:types:check
        continue-on-error: true
      # The live smoke test is the only thing that catches Atlassian changing a
      # response envelope, which fixtures structurally cannot see.
      - name: Live smoke test
        if: ${{ env.BB_TOKEN != '' }}
        env:
          BB_TOKEN: ${{ secrets.BB_TOKEN }}
          BB_EMAIL: ${{ secrets.BB_EMAIL }}
        run: pnpm run spec:live
        continue-on-error: true
      - name: Open an issue on drift
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Bitbucket OpenAPI spec drift detected",
              body: "`generate:types:check` failed. Run `pnpm run generate:types` and review the diff.",
            })
